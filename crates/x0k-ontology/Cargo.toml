[package]
name = "x0k-ontology"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
description = "Compiles a set of OWL vocabulary modules into the Rust class, property, and edge-predicate tables a document's type and edges are checked against."
build = "build.rs"
keywords = ["ontology", "owl", "rdf", "vocabulary", "codegen"]
categories = ["development-tools::build-utils", "data-structures"]
rust-version = { workspace = true }
repository = "https://github.com/0k-dot-computer/x0k-folio"
readme = "../../README.md"

[features]
# The runtime Turtle loader (`src/load.rs`): reading a vocabulary module set
# off a directory rather than only the one this build compiled. On by
# default — a crate whose subject is vocabulary should be able to read one —
# and switchable off by a consumer for whom the generated tables are the
# whole story, which is how `x0k-folio` takes it.
default = ["load"]
load = ["dep:oxttl", "dep:oxrdf"]

# No hand-authored vocabulary is left: every chapter's terms are module
# files now. What this guards is only what a migrated chapter left behind
# because no module can declare it, and only the part of that residue whose
# consumers are several crates or none — the settle-or-queue fold with its
# read-side shapes and closed authority and axis vocabularies, the read-side
# shapes of the entry plane with its two closed value vocabularies and the
# one fixed interpretation kind
# (`x0k:implementation/ontology/{settlement,entry-vocab}`). A residue with
# exactly one consumer crate lives in that crate instead, which is where the
# others went; these two are read by crates that are siblings with no shared
# lower crate, so their home is a placement decision rather than a move.
# Off by default: a plain build is the concept-fact fold and its views. The
# exit condition is that the last residue finds a home, not that the last
# chapter leaves — see `views.md`. The feature carries no dependency of its
# own any more: the blake3 hash left with the finding vocabulary's URI mint.
product = []

[dependencies]
# The TTL parser behind the `load` feature. Also a build dependency below:
# `build.rs` compiles `src/load.rs` in by path, so a build that switches the
# feature off still parses the modules it emits tables from.
oxttl = { version = "0.2", optional = true }
oxrdf = { version = "0.3", optional = true }

[build-dependencies]
# `build.rs` pulls `src/load.rs` in by path and loads the module set through
# it, so the parser is a build dependency whatever the `load` feature says.
oxttl = "0.2"
oxrdf = "0.3"

[dev-dependencies]
# Scratch module directories for the loader's refusal tests.
tempfile = "3"
