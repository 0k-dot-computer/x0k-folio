name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and attach assets to
        required: true
permissions:
  contents: write
jobs:
  artifacts:
    strategy:
      # One target's runner being unavailable must not cancel the others: a
      # partial release is recoverable by re-running, a cancelled one is not.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            setup: "sudo apt-get update && sudo apt-get install -y musl-tools"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            setup: "sudo apt-get update && sudo apt-get install -y musl-tools"
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            setup: ""
          - target: aarch64-apple-darwin
            runner: macos-15
            setup: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            setup: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Toolchain prerequisites for this target
        if: matrix.setup != ''
        shell: bash
        run: ${{ matrix.setup }}
      - shell: bash
        run: ./tools/release-artifacts "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # What `actions/attest-build-provenance` needs: an OIDC token to prove to
      # Sigstore which workflow is asking, and write access to this
      # repository's attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true
      # The release's source closure: the tag's tree and every crate its
      # lockfile resolves, git dependencies included, so a rebuild needs no
      # network. Written before SHA256SUMS, which lists it, and before the
      # attestation, which covers it like the archives.
      - name: Package the source closure
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./tools/release-vendor "$TAG" dist
          test -s "dist/x0k-folio-$TAG-vendor.tar.gz"
      - name: One SHA256SUMS for the whole release
        shell: bash
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
      # The installer rides the release whose archives it installs, so
      # `releases/latest/download/install.sh` is always the latest binaries'
      # script. Copied in after SHA256SUMS (it is not one of the archives the
      # sums vouch for) and before the attestation, which covers it too.
      - name: Attach the installer
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s sh install.sh
          else
            echo "note: shellcheck is not on this runner; install.sh is attached unlinted" >&2
          fi
          cp install.sh dist/install.sh
      # SLSA build provenance for every asset: which workflow, which commit,
      # which runner. Verified by a consumer with
      # `gh attestation verify <file> --repo <owner>/<repo>`, against a public
      # transparency log — no key for this project to hold or lose. The
      # wrapper's postinstall runs the same command when `gh` is present.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Attach the assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
