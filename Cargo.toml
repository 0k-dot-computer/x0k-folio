[workspace]
resolver = "2"
members = ["crates/x0k-folio", "crates/x0k-ontology", "crates/x0k-syntax", "crates/x0k-tangle", "crates/x0k-icon", "crates/x0k-fact-projection", "crates/x0k-folio-ingest", "crates/x0k-folio-dialog", "crates/x0k-folio-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
