[workspace]
resolver = "2"
members = [
    "x0k-folio",
    "x0k-ontology",
    "x0k-syntax",
    "x0k-tangle",
    "x0k-icon",
    "x0k-fact-projection",
    "x0k-folio-ingest",
    "x0k-folio-dialog",
    "x0k-folio-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
